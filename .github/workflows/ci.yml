name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-validate:
    # mlx-swift declares swift-tools-version 6.3, which the macos-15 image's
    # Swift 6.1 refuses to read. macOS 26 runners carry Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Physics validation
        run: ./.build/release/kinetic validate

      - name: Benchmark
        run: ./.build/release/kinetic bench --seconds 1

      - name: Bundle the app
        run: ./Scripts/bundle-app.sh release

  # KineticCore is portable C++. This job is the gate that can run off macOS:
  # it compiles the engine with g++ and asserts scene sizes, contact character,
  # stack stability, determinism and a coarse cost ordering. It does not assert
  # the published M4 milliseconds-per-step table.
  core-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: KineticCore benchmark tests
        run: ./Scripts/bench-core.sh --check --seconds 1
