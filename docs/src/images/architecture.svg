<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic architecture</title>
  <desc id="desc">Studio and CLI sit on KineticRender, KineticBridge and KineticML, which call the Swift Kinetic API, which binds the C ABI over the C++ physics core.</desc>
  <rect width="920" height="520" fill="#0a0a0a"/>
  <text x="28" y="36" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Kinetic layers</text>
  <text x="28" y="56" fill="#8a8a8a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Each layer depends only on the ones below it. Link Kinetic alone for a headless engine.</text>

  <rect x="20" y="76" width="434" height="70" rx="10" fill="#111111" stroke="#2a2a2a"/>
  <text x="40" y="104" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">KineticStudio</text>
  <text x="40" y="124" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">SwiftUI app, NavigationSplitView, timeline, Metal viewport</text>

  <rect x="466" y="76" width="434" height="70" rx="10" fill="#111111" stroke="#2a2a2a"/>
  <text x="486" y="104" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">kinetic CLI</text>
  <text x="486" y="124" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">list, run, validate, render, serve, models</text>

  <rect x="20" y="162" width="284" height="70" rx="10" fill="#111111" stroke="#2a2a2a"/>
  <text x="40" y="190" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">KineticRender</text>
  <text x="40" y="210" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">Metal PBR, shadows, PNG snapshots</text>

  <rect x="318" y="162" width="284" height="70" rx="10" fill="#111111" stroke="#2a2a2a"/>
  <text x="338" y="190" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">KineticBridge</text>
  <text x="338" y="210" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">RFC 6455, foxglove.websocket.v1</text>

  <rect x="616" y="162" width="284" height="70" rx="10" fill="#111111" stroke="#2a2a2a"/>
  <text x="636" y="190" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">KineticML</text>
  <text x="636" y="210" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">MLX policies, insight, scene language</text>

  <rect x="20" y="248" width="880" height="70" rx="10" fill="#111111" stroke="#2a2a2a"/>
  <text x="40" y="276" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Kinetic</text>
  <text x="40" y="296" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">Swift API, URDF, MJCF, USD, meshes, Quickhull, model library, .kinlog</text>

  <rect x="20" y="334" width="880" height="62" rx="10" fill="#071833" stroke="#0070f3"/>
  <text x="40" y="360" fill="#4da3ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">kinetic.h</text>
  <text x="40" y="378" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">stable C ABI, 92 entry points, plain data, opaque kn_world handles</text>

  <rect x="20" y="412" width="880" height="70" rx="10" fill="#111111" stroke="#2a2a2a"/>
  <text x="40" y="440" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">KineticCore</text>
  <text x="40" y="460" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">C++20 physics, CRBA, RNEA, GJK/EPA, PGS solver, no third-party dependencies</text>

  <line x1="460" y1="146" x2="460" y2="162" stroke="#3a3a3a"/>
  <line x1="460" y1="232" x2="460" y2="248" stroke="#3a3a3a"/>
  <line x1="460" y1="318" x2="460" y2="334" stroke="#3a3a3a"/>
  <line x1="460" y1="396" x2="460" y2="412" stroke="#3a3a3a"/>
</svg>
