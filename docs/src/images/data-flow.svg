<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 960 620"><title id="title">Kinetic data flow</title><desc id="desc">Controllers write control and options into World. step() runs kinematics, inertia, collision and the solver, then state fans out to the renderer, recordings, Foxglove and ML insight.</desc><rect width="960" height="620" fill="#0a0a0a"/><text x="28" y="36" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">A step, and where the state goes</text><text x="28" y="56" fill="#8a8a8a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">One World owns qpos, qvel, ctrl and contacts. Everything else is a reader or a writer of those buffers.</text><rect width="200" height="200" x="20" y="84" fill="#111" stroke="#2a2a2a" rx="10"/><text x="36" y="110" fill="#8a8a8a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing=".08em">WRITE</text><text x="36" y="134" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Controllers</text><text x="36" y="156" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">world.control[]</text><text x="36" y="174" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">applyForce / torque</text><text x="36" y="206" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Foxglove client</text><text x="36" y="226" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">publish ctrl back</text><text x="36" y="258" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Studio joints</text><text x="36" y="276" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">write qpos, forward()</text><rect width="440" height="200" x="260" y="84" fill="#071833" stroke="#0070f3" rx="10"/><text x="280" y="110" fill="#4da3ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing=".08em">WORLD.STEP()</text><text x="280" y="134" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">KineticCore pipeline</text><rect width="96" height="44" x="280" y="150" fill="#0a0a0a" stroke="#1e4d8c" rx="6"/><text x="292" y="168" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">1-2</text><text x="292" y="184" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">FK + CRBA</text><rect width="96" height="44" x="388" y="150" fill="#0a0a0a" stroke="#1e4d8c" rx="6"/><text x="400" y="168" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">3-6</text><text x="400" y="184" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">RNEA, a_free</text><rect width="84" height="44" x="496" y="150" fill="#0a0a0a" stroke="#0070f3" rx="6"/><text x="508" y="168" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">7</text><text x="508" y="184" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">collide</text><rect width="84" height="44" x="592" y="150" fill="#0a0a0a" stroke="#0070f3" rx="6"/><text x="604" y="168" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">8-9</text><text x="604" y="184" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">PGS solve</text><rect width="396" height="44" x="280" y="210" fill="#0a0a0a" stroke="#2a2a2a" rx="6"/><text x="292" y="228" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">10</text><text x="292" y="244" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">integrate on the manifold, then sensors and profile</text><rect width="200" height="200" x="740" y="84" fill="#111" stroke="#2a2a2a" rx="10"/><text x="756" y="110" fill="#8a8a8a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing=".08em">READ</text><text x="756" y="134" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">KineticRender</text><text x="756" y="152" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">viewport / PNG</text><text x="756" y="180" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">.kinlog</text><text x="756" y="198" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">seekable recording</text><text x="756" y="226" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Foxglove server</text><text x="756" y="244" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">ws://localhost:8765</text><text x="756" y="270" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">KineticML insight</text><line x1="220" x2="260" y1="184" y2="184" stroke="#0070f3" stroke-width="1.5" marker-end="url(#arr)"/><line x1="700" x2="740" y1="184" y2="184" stroke="#0070f3" stroke-width="1.5" marker-end="url(#arr)"/><defs><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="#0070f3" d="M0,0 L8,4 L0,8 z"/></marker></defs><text x="28" y="322" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Getting a robot into the world</text><rect width="170" height="72" x="20" y="344" fill="#111" stroke="#2a2a2a" rx="10"/><text x="36" y="374" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">SceneLibrary</text><text x="36" y="394" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">stack, arm, quadruped</text><rect width="170" height="72" x="210" y="344" fill="#111" stroke="#2a2a2a" rx="10"/><text x="226" y="374" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">URDF / MJCF</text><text x="226" y="394" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">CLI, Open, API</text><rect width="170" height="72" x="400" y="344" fill="#111" stroke="#2a2a2a" rx="10"/><text x="416" y="374" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Model library</text><text x="416" y="394" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">fetch cache, not vendored</text><rect width="170" height="72" x="590" y="344" fill="#111" stroke="#2a2a2a" rx="10"/><text x="606" y="374" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">USD</text><text x="606" y="394" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">Swift API only</text><rect width="160" height="72" x="780" y="344" fill="#111" stroke="#2a2a2a" rx="10"/><text x="796" y="374" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">World builder</text><text x="796" y="394" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">then compile()</text><line x1="190" x2="210" y1="380" y2="380" stroke="#3a3a3a"/><line x1="380" x2="400" y1="380" y2="380" stroke="#3a3a3a"/><line x1="570" x2="590" y1="380" y2="380" stroke="#3a3a3a"/><line x1="760" x2="780" y1="380" y2="380" stroke="#3a3a3a"/><text x="28" y="456" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Ports and paths that actually exist</text><text x="28" y="482" fill="#b0b0b0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">ws://localhost:8765 Foxglove WebSocket (CLI --port, Studio Settings)</text><text x="28" y="504" fill="#b0b0b0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">~/Library/Application Support/Kinetic/Models/ model cache</text><text x="28" y="526" fill="#b0b0b0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">GITHUB_TOKEN optional, raises GitHub API rate limits on fetch</text><text x="28" y="548" fill="#b0b0b0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">dist/Kinetic Studio.app produced by Scripts/bundle-app.sh, not swift build</text><text x="28" y="580" fill="#666" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">USD loads through the Swift API. The CLI and Studio Open dialog accept URDF and MJCF.</text></svg>